name: Build and Push Docker Image

on:
  push:
    branches:
      - mainbranch
  pull_request:
    branches:
      - mainbranch

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt
      #     pip install flake8

      - name: Build backend Docker image
        run: |
          docker build -t nus-iss-architecting-ai-systems-practice-project-backend ./backend

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Build frontend Docker image
        run: |
          docker build -t nus-iss-architecting-ai-systems-practice-project-frontend ./frontend

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt
          pip install flake8

      # - name: Run Flake8
      #   run: flake8 .
      # - name: Run Backend Flake8
      #   run: |
      #     flake8 backend --count --statistics

      # - name: Run Frontend Flake8
      #   run: |
      #     flake8 frontend --count --statistics

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # - name: Build Docker image
      #   run: |
      #     docker build \
      #       -t ${{ secrets.DOCKER_USERNAME }}/hawker-app:latest .

      - name: Check files backend
        run: |
          pwd
          ls -la
          ls -la backend
          find . -name Dockerfile -o -name requirements.txt

      - name: Check files frontend
        run: |
          pwd
          ls -la
          ls -la frontend
          find . -name Dockerfile -o -name requirements.txt

      - name: Build Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hawker-backend:latest -f backend/Dockerfile backend

      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hawker-frontend:latest -f frontend/Dockerfile frontend

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/hawker-app:latest
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      # - name: Push Docker image
      #   run: |
      #     docker push ${{ secrets.DOCKER_USERNAME }}/hawker-app:latest
      - name: Push Backend Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hawker-backend:latest

      - name: Push Frontend Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hawker-frontend:latest
  
  deploy:
    needs: docker
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
              echo "OPENAI_API_KEY secret is not set."
              exit 1
            fi
            if [ -z "${{ secrets.ONEMAP_EMAIL }}" ]; then
              echo "ONEMAP_EMAIL secret is not set."
              exit 1
            fi
            if [ -z "${{ secrets.ONEMAP_EMAIL_PASSWORD }}" ]; then
              echo "ONEMAP_EMAIL_PASSWORD secret is not set."
              exit 1
            fi
            if [ -z "${{ secrets.AWS_REGION }}" ]; then
              echo "AWS_REGION secret is not set."
              exit 1
            fi
  
            docker pull ${{ secrets.DOCKER_USERNAME }}/hawker-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/hawker-frontend:latest

            docker network create hawker-net || true
            docker volume create hawker-sessions || true
            docker volume create hawker-traces || true

  
            docker stop hawker-backend || true
            docker rm hawker-backend || true
            docker stop hawker-frontend || true
            docker rm hawker-frontend || true
  
            docker run -d \
              --name hawker-backend \
              --network hawker-net \
              -v hawker-sessions:/app/sessions \
              -v hawker-traces:/app/traces \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e ONEMAP_EMAIL="${{ secrets.ONEMAP_EMAIL }}" \
              -e ONEMAP_EMAIL_PASSWORD="${{ secrets.ONEMAP_EMAIL_PASSWORD }}" \
              --log-driver=awslogs \
              --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
              --log-opt awslogs-group=/smart-hawker/backend \
              --log-opt awslogs-stream=hawker-backend \
              --log-opt awslogs-create-group=true \
              --restart unless-stopped \
              -p 80:8000 \
              ${{ secrets.DOCKER_USERNAME }}/hawker-backend:latest

            docker run -d \
              --name hawker-frontend \
              --network hawker-net \
              -e BACKEND_URL=http://hawker-backend:8000 \
              -e ENABLE_TRACE_VIEWER=true \
              -e TRACE_VIEWER_ALLOW_REMOTE=true \
              --log-driver=awslogs \
              --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
              --log-opt awslogs-group=/smart-hawker/frontend \
              --log-opt awslogs-stream=hawker-frontend \
              --log-opt awslogs-create-group=true \
              --restart unless-stopped \
              -p 81:5000 \
              ${{ secrets.DOCKER_USERNAME }}/hawker-frontend:latest
  
  #remember to install docker on the ubuntu vm before running deploy
# sudo apt update
# sudo apt install docker.io -y
# sudo systemctl enable docker
# sudo systemctl start docker
