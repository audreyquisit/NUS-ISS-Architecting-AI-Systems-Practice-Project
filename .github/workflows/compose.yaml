name: Run Hawker app

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Create docker network
              run: docker network create hawker-net || true

            - name: Create data volumes
              run: |
                docker volume create hawker-sessions || true
                docker volume create hawker-traces || true

            - name: Start frontend container
              run: |
                docker run -d \
                  --name hawker-frontend \
                  --network hawker-net \
                  -p 80:5000 \
                  --restart unless-stopped \
                  -e BACKEND_URL=http://hawker-backend:8000 \
                  -e ENABLE_TRACE_VIEWER=true \
                  -e TRACE_VIEWER_ALLOW_REMOTE=true \
                  ${{ secrets.DOCKER_USERNAME }}/hawker-frontend:latest

            - name: Start backend container
              run: |
                docker run -d \
                  --name hawker-backend \
                  --network hawker-net \
                  --expose 8000 \
                  -v hawker-sessions:/app/sessions \
                  -v hawker-traces:/app/traces \
                  --restart unless-stopped \
                  -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
                  -e ONEMAP_EMAIL="${{ secrets.ONEMAP_EMAIL }}" \
                  -e ONEMAP_EMAIL_PASSWORD="${{ secrets.ONEMAP_EMAIL_PASSWORD }}" \
                  ${{ secrets.DOCKER_USERNAME }}/hawker-backend:latest
